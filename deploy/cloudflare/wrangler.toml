name = "pastpaper-studio-device"
main = "worker.mjs"
compatibility_date = "2026-11-12"
workers_dev = false
preview_urls = false

[assets]
directory = "../../frontend/public/device"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[r2_buckets]]
binding = "SHARED_PAPERS"
bucket_name = "pastpaper-studio-shared"

[[ratelimits]]
name = "SHARE_LIMIT"
namespace_id = "803141"
simple = { limit = 35, period = 60 }

[observability]
enabled = false
